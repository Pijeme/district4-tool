# This is the only application file needed on the server, alongside .env.
services:
  district4:
    image: ${DOCKER_IMAGE:-pijeme/district4-tool-main}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      AI_DATABASE: /data/ai_index.db
      TZ: ${TZ:-Asia/Manila}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-5000}:8000"
    volumes:
      - district4-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  district4-data:
