name: Diagnose District 4 ebook access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.247.158.139 >> ~/.ssh/known_hosts
      - name: Check library access without changing data
        run: |
          ssh -o BatchMode=yes developer@84.247.158.139 << 'REMOTE'
          set -e
          cd /home/developer/district4-tool-main
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/home/developer')
          count = 0
          matches = []
          for directory, subdirs, files in os.walk(root):
              relative = Path(directory).relative_to(root)
              subdirs[:] = [name for name in subdirs if not name.startswith('.') and name not in ('node_modules', 'book_thumbnail_cache', 'bible_study_data', 'event_assets', 'ccm_assets', '__pycache__')]
              if len(relative.parts) >= 4:
                  subdirs[:] = []
              for name in files:
                  if not name.lower().endswith('.json'):
                      continue
                  path = Path(directory) / name
                  try:
                      if path.stat().st_size > 65536:
                          continue
                      value = json.loads(path.read_text())
                      if isinstance(value, dict) and value.get('type') == 'service_account' and value.get('private_key') and value.get('client_email'):
                          matches.append(str(path))
                  except (OSError, ValueError, UnicodeError):
                      pass
          print('existing_service_account_files=' + str(matches), flush=True)
          PY
          REMOTE
