name: Diagnose District 4 ebook access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.247.158.139 >> ~/.ssh/known_hosts
      - name: Check library access without changing data
        run: |
          ssh -o BatchMode=yes developer@84.247.158.139 << 'REMOTE'
          set -e
          cd /home/developer/district4-tool-main
          timeout 120 .venv/bin/python - <<'PY'
          import os, subprocess, time
          from pathlib import Path
          from types import SimpleNamespace
          pid=subprocess.check_output(['systemctl','show','district4-tool','-p','MainPID','--value'],text=True).strip()
          try:
              raw=Path('/proc/'+pid+'/environ').read_bytes()
              os.environ.update(dict(part.decode().split('=',1) for part in raw.split(b'\0') if b'=' in part))
          except OSError:
              print('service_environment_loaded=False',flush=True)
              raise SystemExit(1)
          from flask import Flask
          from runtime_config import data_path
          import pastor_resources as resources
          import bible_study as study
          import pij_library_knowledge as knowledge
          app=Flask(__name__,static_folder=str(Path.cwd()/'static'))
          app.config.update(DATABASE=data_path('app_v2.db'),
              AI_DATABASE=os.getenv('AI_DATABASE') or data_path('ai_index.db'),
              BIBLE_STUDY_DATABASE=os.getenv('BIBLE_STUDY_DATABASE') or data_path('bible_study_data/bible_study.db'),
              BIBLE_ILLUSTRATIONS_DATABASE=os.getenv('BIBLE_ILLUSTRATIONS_DATABASE',''))
          app.config['BIBLE_SERMON_NOTES_DATABASE']=os.getenv('BIBLE_SERMON_NOTES_DATABASE') or str(Path(app.config['BIBLE_STUDY_DATABASE']).with_name('sermon_notes.db'))
          resources._appmod=lambda:SimpleNamespace(DATABASE=app.config['DATABASE'],AI_DATABASE=app.config['AI_DATABASE'])
          def forbidden(*args,**kwargs):raise AssertionError('Personal sermon access must never occur')
          knowledge._private_sermon_search=forbidden
          study.sermon_notes_storage=forbidden
          queries=[('outlines','Create a sermon about faith'),
                   ('illustrations','Find a sermon illustration about prayer'),
                   ('submitted_outline','Analyze my outline and recommend illustrations:\nI. Trust God\nII. Pray faithfully')]
          with app.test_request_context():
              for label,query in queries:
                  started=time.monotonic()
                  result=knowledge.library_context_for_gemini(query)
                  sources=getattr(result,'approved_sources',())
                  print(label+'_source_count='+str(len(sources)),flush=True)
                  print(label+'_seconds='+str(round(time.monotonic()-started,3)),flush=True)
                  print(label+'_context_chars='+str(len(result)),flush=True)
                  assert all(row['url'].startswith('/pastor-resources/bible-study?') for row in sources)
                  assert not any('/sermon-ebooks/' in row['url'] for row in sources)
                  if label=='outlines':print('outline_only_notice='+str(result.outline_only_notice),flush=True)
                  if label=='submitted_outline':
                      points=getattr(result,'sermon_point_matches',())
                      print('submitted_main_points='+str(len(points)),flush=True)
                      print('points_with_illustrations='+str(sum(bool(point['source']) for point in points)),flush=True)
          print('private_sermon_access_occurred=False',flush=True)
          PY
          REMOTE
