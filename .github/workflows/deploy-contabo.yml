name: Diagnose District 4 ebook access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.247.158.139 >> ~/.ssh/known_hosts
      - name: Check library access without changing data
        run: |
          ssh -o BatchMode=yes developer@84.247.158.139 << 'REMOTE'
          set -e
          cd /home/developer/district4-tool-main
          timeout 720 .venv/bin/python - <<'PY'
          import os,subprocess,sqlite3,json,time
          from pathlib import Path
          pid=subprocess.check_output(['systemctl','show','district4-tool','-p','MainPID','--value'],text=True).strip()
          os.environ.update(dict(part.decode().split('=',1) for part in Path('/proc/'+pid+'/environ').read_bytes().split(b'\0') if b'=' in part))
          from runtime_config import data_path
          import bible_study as study
          path=Path(os.getenv('BIBLE_STUDY_DATABASE') or data_path('bible_study_data/bible_study.db')).resolve()
          work=path.parent/'spacing_maintenance'
          plan=json.loads((work/'source_verified_plan.json').read_text())
          print('planned_verses='+str(len(plan['changes'])),flush=True)
          print('database_bytes='+str(path.stat().st_size),flush=True)
          start=time.monotonic()
          report=study.repair_bible_spacing(path,plan,dry_run=True)
          (work/'validated_spacing_report.json').write_text(json.dumps(report,ensure_ascii=False))
          print('spacing_validation='+report['status'],flush=True)
          print('validation_seconds='+str(round(time.monotonic()-start,2)),flush=True)
          print('translation_counts='+json.dumps(report['translations']),flush=True)
          print('anchor_mapping_counts='+json.dumps(report['anchors']),flush=True)
          print('original_database_unchanged=True',flush=True)
          PY
          REMOTE
