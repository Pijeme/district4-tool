name: Diagnose District 4 ebook access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.247.158.139 >> ~/.ssh/known_hosts
      - name: Check library access without changing data
        run: |
          ssh -o BatchMode=yes developer@84.247.158.139 << 'REMOTE'
          set -e
          cd /home/developer/district4-tool-main
          timeout 240 .venv/bin/python - <<'PY'
          import os,subprocess,sqlite3,re,json,collections
          from pathlib import Path
          pid=subprocess.check_output(['systemctl','show','district4-tool','-p','MainPID','--value'],text=True).strip()
          raw=Path('/proc/'+pid+'/environ').read_bytes()
          os.environ.update(dict(part.decode().split('=',1) for part in raw.split(b'\0') if b'=' in part))
          from runtime_config import data_path
          path=Path(os.getenv('BIBLE_STUDY_DATABASE') or data_path('bible_study_data/bible_study.db'))
          with sqlite3.connect(path.resolve().as_uri()+'?mode=ro',uri=True) as db:
              db.row_factory=sqlite3.Row
              for translation in ('NIV','CEBOCB','TCB'):
                  edition=db.execute('''SELECT e.id,s.title,s.sha256,s.source_path,d.source_kind FROM bible_editions e
                      JOIN bible_sources s ON s.id=e.source_id LEFT JOIN bible_edition_details d ON d.edition_id=e.id
                      WHERE e.translation=? AND e.is_active=1 AND e.status='ready' ''',(translation,)).fetchone()
                  if not edition:
                      print(json.dumps(dict(translation=translation,available=False)),flush=True);continue
                  verses=db.execute('SELECT id,book_id,chapter,verse,text FROM bible_verses WHERE edition_id=? AND is_active=1',(edition['id'],)).fetchall()
                  patterns=collections.Counter();samples=[];token_errors=0
                  for verse in verses:
                      suspect=[token for token in re.findall(r"\w+(?:['’]\w+)*",verse['text']) if re.search(r'[a-zà-ÿ][A-ZÀ-Þ]',token)]
                      patterns.update(suspect)
                      if suspect and len(samples)<18:samples.append(dict(reference=[verse['book_id'],verse['chapter'],verse['verse']],words=suspect,text=verse['text'][:400]))
                      for token in db.execute('SELECT start_offset,end_offset,text FROM bible_tokens WHERE verse_id=?',(verse['id'],)):
                          if verse['text'][token['start_offset']:token['end_offset']]!=token['text']:token_errors+=1
                  print(json.dumps(dict(translation=translation,source=dict(edition),verses=len(verses),token_offset_errors=token_errors,
                      suspected_words=patterns.most_common(35),samples=samples),ensure_ascii=False),flush=True)
          print('audit_complete=True',flush=True)
          PY
          REMOTE
