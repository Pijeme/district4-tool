name: Diagnose District 4 ebook access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.247.158.139 >> ~/.ssh/known_hosts
      - name: Check library access without changing data
        run: |
          ssh -o BatchMode=yes developer@84.247.158.139 << 'REMOTE'
          set -e
          cd /home/developer/district4-tool-main
          .venv/bin/python - <<'PY'
          import os, sqlite3, subprocess, sys
          from pathlib import Path
          
          def report(key, value):
              print(key + '=' + str(value), flush=True)
          
          pid = subprocess.check_output(['systemctl', 'show', 'district4-tool', '-p', 'MainPID', '--value'], text=True).strip()
          report('service_running', pid.isdigit() and pid != '0')
          try:
              raw = Path('/proc/' + pid + '/environ').read_bytes()
              variables = dict(pair.decode().split('=', 1) for pair in raw.split(b'\0') if b'=' in pair)
              os.environ.update(variables)
              report('service_environment_loaded', True)
          except (OSError, UnicodeError):
              report('service_environment_loaded', False)
          report('service_uses_checkout', Path('/proc/' + pid + '/cwd').resolve() == Path.cwd())
          from runtime_config import data_path, google_credentials, BASE_DIR
          import pastor_resources as resources
          report('thumbnail_fix_present', 'local-covers-2' in Path('pastor_resources.py').read_text())
          report('local_cover_directory', resources.THUMBNAIL_CACHE_DIR)
          cover = Path(resources.THUMBNAIL_CACHE_DIR)
          report('cover_directory_exists', cover.is_dir())
          report('cover_directory_writable', os.access(cover if cover.exists() else cover.parent, os.W_OK))
          for module in ('pypdfium2', 'PIL'):
              try:
                  __import__(module)
                  report(module + '_available', True)
              except ImportError:
                  report(module + '_available', False)
          
          try:
              session = resources.get_drive_session()
              report('google_credentials_load', 'ok')
          except Exception as error:
              report('google_credentials_load', type(error).__name__)
              report('credentials_env_present', any(os.getenv(key, '').strip() for key in ('GOOGLE_SERVICE_ACCOUNT_JSON', 'GOOGLE_SERVICE_ACCOUNT_BASE64')))
              candidate = Path(os.getenv('GOOGLE_SERVICE_ACCOUNT_FILE') or resources.GOOGLE_SERVICE_ACCOUNT_FILE)
              if not candidate.is_absolute():
                  candidate = BASE_DIR / candidate
              report('credential_file_exists', candidate.is_file())
              report('credential_file_readable', os.access(candidate, os.R_OK))
              sys.exit(0)
          
          known_reasons = {'notFound', 'forbidden', 'insufficientPermissions', 'accessNotConfigured', 'serviceDisabled', 'rateLimitExceeded', 'dailyLimitExceeded', 'downloadQuotaExceeded', 'storageQuotaExceeded', 'fileNotDownloadable', 'cannotDownloadFile', 'authError', 'userRateLimitExceeded', 'invalid', 'backendError'}
          def check_response(label, response):
              report(label + '_http', response.status_code)
              if not response.ok:
                  try:
                      error = response.json().get('error', {})
                      report(label + '_reasons', [row.get('reason') if row.get('reason') in known_reasons else 'other' for row in error.get('errors', [])])
                  except Exception:
                      report(label + '_reasons', 'not_json')
              return response.ok
          
          try:
              response = session.get('https://www.googleapis.com/drive/v3/files/' + resources.PASTOR_RESOURCES_DRIVE_FOLDER_ID, params={'fields': 'id', 'supportsAllDrives': 'true'}, timeout=20)
              check_response('library_folder', response)
              response.close()
          except Exception as error:
              report('drive_connection_exception', type(error).__name__)
              # Credential refresh errors may contain private details: classify, never echo.
              message = str(error).lower()
              for marker in ('invalid_grant', 'invalid jwt signature', 'invalid jwt', 'invalid_client', 'disabled', 'expired', 'name resolution', 'certificate'):
                  if marker in message:
                      report('drive_exception_category', marker)
              sys.exit(0)
          
          path = Path(data_path('app_v2.db'))
          if not path.is_file():
              report('database_present', False)
              sys.exit(0)
          with sqlite3.connect(path.resolve().as_uri() + '?mode=ro', uri=True) as db:
              report('active_ebook_count', db.execute('SELECT COUNT(*) FROM pastor_library_files WHERE is_active=1 AND is_duplicate=0').fetchone()[0])
              samples = []
              for fmt in ('PDF', 'EPUB'):
                  row = db.execute('SELECT drive_file_id FROM pastor_library_files WHERE format=? AND is_active=1 AND is_duplicate=0 ORDER BY id LIMIT 1', (fmt,)).fetchone()
                  if row:
                      samples.append((fmt, row[0]))
          for fmt, file_id in samples:
              try:
                  with session.get('https://www.googleapis.com/drive/v3/files/' + str(file_id), params={'fields': 'id,trashed,capabilities(canDownload)', 'supportsAllDrives': 'true'}, timeout=20) as response:
                      if check_response(fmt + '_metadata', response):
                          metadata = response.json()
                          report(fmt + '_trashed', metadata.get('trashed', False))
                          report(fmt + '_can_download', metadata.get('capabilities', {}).get('canDownload'))
                  with session.get('https://www.googleapis.com/drive/v3/files/' + str(file_id), params={'alt': 'media', 'supportsAllDrives': 'true'}, headers={'Range': 'bytes=0-15'}, stream=True, timeout=20) as response:
                      if check_response(fmt + '_download', response):
                          report(fmt + '_received_bytes', len(next(response.iter_content(chunk_size=16), b'')))
              except Exception as error:
                  report(fmt + '_access_exception', type(error).__name__)
          PY
          REMOTE
